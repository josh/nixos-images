name: Nix

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: nix-slim-x86_64-linux

    env:
      NIX_ABORT_ON_WARN: "1"
      NIX_CONFIG: |
        allow-import-from-derivation = false
      FLAKE_URI: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz

    steps:
      - name: Check flake
        run: nix flake check --keep-going --print-build-logs "$FLAKE_URI"

      - name: Build ISOs
        run: nix build --keep-going --print-build-logs "$FLAKE_URI#all-isos"
